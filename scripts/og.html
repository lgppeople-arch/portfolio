<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>og</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  /* 링크 미리보기 이미지(1200×630) 틀. scripts/make-og.js가 페이지별 글자를 채워 찍는다 */
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0B1118; }
  .card { position: relative; width: 1200px; height: 630px; color: #EEF1F4; font-family: "IBM Plex Sans KR", sans-serif; }
  canvas { position: absolute; right: -60px; top: 50%; transform: translateY(-50%); }
  .in { position: absolute; left: 72px; top: 64px; width: 600px; bottom: 56px; display: flex; flex-direction: column; }
  .in.wide { width: 860px; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 21px; }
  .brand .mono { background: #EEF1F4; color: #0B1118; font-family: "IBM Plex Sans KR", sans-serif; font-weight: 700; font-size: 18px; padding: 6px 9px; border-radius: 7px; letter-spacing: -0.02em; }
  .brand b { font-weight: 700; font-size: 24px; }
  .brand span { color: #A5AEB7; }
  .kick { margin-top: 64px; font-family: "IBM Plex Mono", monospace; font-size: 19px; letter-spacing: 0.08em; color: #E08A57; text-transform: uppercase; }
  h1 { word-break: keep-all; margin: 14px 0 0; font-family: "Gothic A1", sans-serif; font-weight: 800; letter-spacing: -0.025em; line-height: 1.14; font-size: 70px; }
  h1 em { font-style: normal; color: #E08A57; }
  .desc { margin-top: 22px; font-size: 22px; line-height: 1.55; color: #C3CAD1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .foot { position: absolute; left: 72px; right: 72px; bottom: 44px; display: flex; justify-content: space-between; align-items: center; padding-top: 18px; border-top: 1px solid #26323D; font-size: 19px; color: #A5AEB7; }
  .foot .url { font-family: "IBM Plex Mono", monospace; color: #EEF1F4; }
</style>
</head>
<body>
<div class="card">
  <canvas id="art" width="560" height="560"></canvas>
  <div class="in" id="in">
    <div class="brand"><span class="mono">LGP</span><b>이기표</b><span>재무기획 · 전략기획</span></div>
    <div class="kick" id="kick"></div>
    <h1 id="title"></h1>
    <div class="desc" id="desc"></div>
  </div>
  <div class="foot"><span id="label"></span><span class="url">lgppeople-arch.github.io/portfolio</span></div>
</div>
<script>
  /* 오른쪽 장식: 웨이퍼처럼 보이는 격자 원(홈 리포트 표지와 같은 규칙) */
  window.drawArt = function (seed) {
    const cv = document.getElementById("art"), g = cv.getContext("2d"), cx = 280, cy = 280, R = 258, st = 11;
    let s = seed >>> 0; const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
    g.clearRect(0, 0, 560, 560);
    g.strokeStyle = "#26323D"; g.lineWidth = 2; g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.stroke();
    const ph = rnd() * 6;
    for (let x = cx - R; x < cx + R; x += st) for (let y = cy - R; y < cy + R; y += st) {
      const dx = x + st / 2 - cx, dy = y + st / 2 - cy, d = Math.hypot(dx, dy);
      if (d > R - st * 0.8) continue;
      const w = 0.5 + 0.5 * Math.sin(ph - d / R * 7 + Math.atan2(dy, dx) * 1.2), hot = rnd() > 0.978;
      g.fillStyle = hot ? "#B5612F" : w > 0.72 ? "#2E7A5C" : "#2C3F78";
      g.globalAlpha = hot ? 0.95 : 0.18 + w * 0.6;
      g.fillRect(x + 1, y + 1, st - 2, st - 2);
    }
    g.globalAlpha = 1;
  };
  window.fill = function (d) {
    document.getElementById("kick").textContent = d.kick || "";
    document.getElementById("title").innerHTML = d.title;
    document.getElementById("desc").textContent = d.desc || "";
    document.getElementById("label").textContent = d.label || "";
    document.getElementById("in").className = "in" + (d.wide ? " wide" : "");
    const art = document.getElementById("art"); art.style.opacity = d.wide ? 0.4 : 1; art.style.right = d.wide ? "-230px" : "-60px";
    const h = document.getElementById("title"); let fs = d.size || 70; h.style.fontSize = fs + "px";
    const maxH = d.desc ? 250 : 330;
    const lines = (d.title.match(/<br/g) || []).length + 1;
    while ((h.scrollHeight > maxH || h.scrollWidth > h.clientWidth + 1 || h.getBoundingClientRect().height > lines * fs * 1.14 * 1.08) && fs > 40) { fs -= 2; h.style.fontSize = fs + "px"; }
    window.drawArt(d.seed || 7);
  };
</script>
</body>
</html>
